<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Báo cáo phương pháp đầu tư — truy cập có mật khẩu</title>
<style>
/* Giao dien trang bao cao. Khong dung framework: trang phai duoi 2 MB (NFR4).
   Mau chon theo tuong phan WCAG AA tren nen sang (NFR6). */

:root {
  --nen: #f7f8fa;
  --the: #ffffff;
  --vien: #d8dde5;
  --chu: #16202e;
  --chu-nhat: #5b6470;
  --nhan-manh: #1f4e8c;
  --tang: #067647;
  --giam: #b42318;
  --canh-bao: #8a5700;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  padding: 0 12px 48px;
  background: var(--nen);
  color: var(--chu);
  font: 15px/1.55 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  overflow-wrap: break-word;
}

.khung { max-width: 1200px; margin: 0 auto; }

h1 { font-size: 1.4rem; margin: 18px 0 4px; }
h2 { font-size: 1.15rem; margin: 26px 0 8px; }
h3 { font-size: 1rem; margin: 18px 0 6px; color: var(--nhan-manh); }

a { color: var(--nhan-manh); }

.the {
  background: var(--the);
  border: 1px solid var(--vien);
  border-radius: 10px;
  padding: 14px;
  margin: 14px 0;
}

/* --- Man hinh nhap mat khau --- */

#man-mo-khoa { max-width: 420px; margin: 12vh auto; }

#man-mo-khoa label { display: block; font-weight: 600; margin-bottom: 6px; }

#man-mo-khoa input,
#man-mo-khoa button {
  width: 100%;
  padding: 11px 12px;
  font-size: 16px; /* 16px de iOS khong tu phong to khi focus */
  border-radius: 8px;
  border: 1px solid var(--vien);
}

#man-mo-khoa button {
  margin-top: 10px;
  background: var(--nhan-manh);
  color: #fff;
  border-color: var(--nhan-manh);
  font-weight: 600;
  cursor: pointer;
}

#man-mo-khoa button:disabled { opacity: 0.6; cursor: progress; }

.thong-bao-loi { color: var(--giam); font-weight: 600; margin-top: 10px; min-height: 1.4em; }
.thong-bao-nhe { color: var(--canh-bao); margin-top: 10px; min-height: 1.4em; }

:focus-visible { outline: 3px solid #1f4e8c; outline-offset: 2px; }

/* --- Thanh trang thai --- */

.thanh-trang-thai {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 18px;
  align-items: center;
  font-size: 0.9rem;
  color: var(--chu-nhat);
}

.nhan-phien {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  background: #e8f1fd;
  color: var(--nhan-manh);
  font-weight: 600;
}

.nhan-phien[data-trang-thai="closed"] { background: #e9f7ef; color: var(--tang); }
.nhan-phien[data-trang-thai="no_new_data"] { background: #fdf3e6; color: var(--canh-bao); }

button.chinh {
  padding: 9px 14px;
  border-radius: 8px;
  border: 1px solid var(--nhan-manh);
  background: var(--nhan-manh);
  color: #fff;
  font-weight: 600;
  font-size: 0.95rem;
  cursor: pointer;
}

button.chinh:disabled { opacity: 0.6; cursor: progress; }

/* --- Bang --- */

.bang-cuon {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--vien);
  border-radius: 10px;
  background: var(--the);
  margin: 12px 0;
}

.bang-cuon table {
  border-collapse: collapse;
  width: 100%;
  min-width: 640px; /* tren khung 375px thi cuon trong khung, khong tran ca trang */
  font-size: 0.88rem;
}

.bang-cuon th,
.bang-cuon td {
  border-bottom: 1px solid var(--vien);
  padding: 8px 10px;
  text-align: left;
  vertical-align: top;
}

.bang-cuon thead th {
  position: sticky;
  top: 0;
  background: #eef1f6;
  font-weight: 600;
  white-space: nowrap;
}

.bang-cuon tbody tr:nth-child(even) { background: #fbfcfe; }

th.sap-xep-duoc { cursor: pointer; user-select: none; }
th.sap-xep-duoc::after { content: " ⇅"; color: var(--chu-nhat); font-weight: 400; }
th.sap-xep-duoc[aria-sort="ascending"]::after { content: " ↑"; color: var(--nhan-manh); }
th.sap-xep-duoc[aria-sort="descending"]::after { content: " ↓"; color: var(--nhan-manh); }

td.so { text-align: right; font-variant-numeric: tabular-nums; }
td.tang { color: var(--tang); }
td.giam { color: var(--giam); }
tr[data-thieu-lich-su="true"] td { color: var(--chu-nhat); font-style: italic; }

/* --- Chi so che do --- */

.luoi-chi-so {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
}

.o-chi-so {
  border: 1px solid var(--vien);
  border-radius: 8px;
  padding: 10px;
  background: var(--the);
}

.o-chi-so .ten { display: block; font-size: 0.78rem; color: var(--chu-nhat); }
.o-chi-so .gia-tri { display: block; font-size: 1.05rem; font-weight: 600; }

.diem-che-do { font-size: 1.6rem; font-weight: 700; }
.diem-che-do[data-regime="UPTREND"] { color: var(--tang); }
.diem-che-do[data-regime="SIDEWAY"] { color: var(--canh-bao); }
.diem-che-do[data-regime="DOWNTREND"] { color: var(--giam); }

.thanh-loc { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 10px 0; }
.thanh-loc input, .thanh-loc select {
  padding: 9px 10px;
  font-size: 16px;
  border: 1px solid var(--vien);
  border-radius: 8px;
}
.thanh-loc input { flex: 1 1 180px; min-width: 0; }

/* --- So do --- */

.so-do { margin: 14px 0; overflow-x: auto; }
.so-do-hinh { max-width: 100%; height: auto; display: block; }

figure { margin: 14px 0; }

code {
  background: #eef1f6;
  padding: 1px 5px;
  border-radius: 4px;
  font-size: 0.86em;
}

footer { margin-top: 28px; font-size: 0.82rem; color: var(--chu-nhat); }

</style>
</head>
<body>
<!-- Trang nay khong chua noi dung o dang doc duoc. Toan bo noi dung nam trong
     khoi ma AES-GCM 256 duoi day va chi duoc giai trong trinh duyet sau khi
     nhap dung mat khau (FR6.1, FR6.2, FR6.3). -->
<main class="khung">
  <section id="man-mo-khoa" class="the">
    <h1>Báo cáo phương pháp đầu tư — truy cập có mật khẩu</h1>
    <p>Nội dung được mã hoá. Nhập mật khẩu để mở.</p>
    <form id="form-mo-khoa" autocomplete="off">
      <label for="o-mat-khau">Mật khẩu</label>
      <input id="o-mat-khau" data-testid="o-mat-khau" type="password"
             autocomplete="current-password" inputmode="text" required>
      <button id="nut-mo" data-testid="nut-mo" type="submit">Mở nội dung</button>
    </form>
    <p id="thong-bao-mo-khoa" data-testid="thong-bao-mo-khoa" class="thong-bao-loi"
       role="status" aria-live="polite"></p>
    <footer>
      Giải mã bằng Web Crypto API ngay trên máy bạn. Mật khẩu không được gửi đi đâu.
      Bản dựng: 2026-09-15 13:33
    </footer>
  </section>
  <div id="noi-dung" class="khung" hidden></div>
</main>

<script type="module">
// Giao dien phia trinh duyet: giai ma noi dung, sap xep va loc bang.
//
// Khong dung framework JavaScript. Toan bo tep nay duoc nhung thang vao trang
// nen moi kilobyte deu tinh vao han muc 2 MB cua NFR4.
//
// Hai nhom ham tach biet co y:
//   * Ham thuan (giai ma, sap xep, loc, goi mang) — khong cham vao DOM, nen
//     `node --test` kiem duoc truc tiep.
//   * Ham gan vao DOM — chi chay trong trinh duyet, duoc bao ve bang mot phep
//     kiem su ton tai cua `document`.
//
// Phu: FR3.4, FR6.2.

const KHOI_MA_ID = 'khoi-ma';
const CAU_HINH_ID = 'cau-hinh';

/** So vong PBKDF2 toi thieu duoc chap nhan; khop voi FR6.1 va `crypto.py`. */
export const SO_VONG_TOI_THIEU = 600000;

/** Loi giai ma: mat khau sai, khoi ma bi sua, hoac dinh dang khong ho tro. */
export class LoiGiaiMa extends Error {
  constructor(thongDiep) {
    super(thongDiep);
    this.name = 'LoiGiaiMa';
  }
}

/** Doi base64 sang mang byte. */
export function b64ToBytes(b64) {
  let chuoi;
  try {
    chuoi = atob(String(b64));
  } catch {
    throw new LoiGiaiMa('Khối mã không phải base64 hợp lệ.');
  }
  const byte = new Uint8Array(chuoi.length);
  for (let i = 0; i < chuoi.length; i += 1) byte[i] = chuoi.charCodeAt(i);
  return byte;
}

/** Kiem khoi ma khai bao dung tham so ma trang nay ho tro. */
export function kiemKhoiMa(khoi) {
  if (!khoi || typeof khoi !== 'object') {
    throw new LoiGiaiMa('Không tìm thấy khối mã trong trang.');
  }
  if (khoi.v !== 1) {
    throw new LoiGiaiMa(`Phiên bản khối mã không hỗ trợ: ${khoi.v}`);
  }
  if (khoi.cipher !== 'AES-GCM' || khoi.key_bits !== 256) {
    throw new LoiGiaiMa('Khối mã không dùng AES-GCM 256.');
  }
  if (khoi.kdf !== 'PBKDF2' || khoi.hash !== 'SHA-256') {
    throw new LoiGiaiMa('Khối mã không dùng PBKDF2-SHA256.');
  }
  if (!(Number(khoi.iterations) >= SO_VONG_TOI_THIEU)) {
    throw new LoiGiaiMa(
      `Số vòng PBKDF2 dưới ngưỡng ${SO_VONG_TOI_THIEU}: ${khoi.iterations}`,
    );
  }
  return true;
}

/** Dan xuat khoa AES-GCM tu mat khau bang PBKDF2-SHA256. */
export async function danXuatKhoa(matKhau, muoi, soVong, subtle = globalThis.crypto.subtle) {
  const goc = await subtle.importKey(
    'raw',
    new TextEncoder().encode(matKhau),
    'PBKDF2',
    false,
    ['deriveKey'],
  );
  return subtle.deriveKey(
    { name: 'PBKDF2', salt: muoi, iterations: Number(soVong), hash: 'SHA-256' },
    goc,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt'],
  );
}

/**
 * Giai khoi ma do `src/site/crypto.py` sinh ra.
 *
 * Tra ve noi dung goc dang chuoi. Bao `LoiGiaiMa` khi mat khau sai — thong
 * diep loi khong bao gio chua manh noi dung nao (FR6.2, FR6.3).
 */
export async function giaiMaKhoi(khoi, matKhau, subtle = globalThis.crypto.subtle) {
  kiemKhoiMa(khoi);
  if (!matKhau) throw new LoiGiaiMa('Chưa nhập mật khẩu.');

  const khoa = await danXuatKhoa(matKhau, b64ToBytes(khoi.salt), khoi.iterations, subtle);
  try {
    const ro = await subtle.decrypt(
      { name: 'AES-GCM', iv: b64ToBytes(khoi.iv) },
      khoa,
      b64ToBytes(khoi.ciphertext),
    );
    return new TextDecoder().decode(ro);
  } catch {
    throw new LoiGiaiMa('Mật khẩu không đúng hoặc nội dung đã bị sửa.');
  }
}

/** Coi mot gia tri la o trong (khong co du lieu) hay khong. */
function laTrong(gia_tri) {
  return gia_tri === null || gia_tri === undefined || Number.isNaN(gia_tri);
}

/**
 * Sap xep danh sach dong theo mot cot.
 *
 * O trong luon xuong duoi bat ke chieu sap xep, vi ma thieu lich su khong nen
 * chiem dau bang chi vi khong co so lieu (FR3.2). Tra ve mang moi, khong sua
 * mang goc.
 */
export function sapXepDong(dong, cot, huong = 'asc') {
  const dau = huong === 'desc' ? -1 : 1;
  const theoMa = (a, b) => a.symbol.localeCompare(b.symbol, 'vi');

  return [...dong].sort((a, b) => {
    if (cot === 'symbol') return dau * theoMa(a, b);
    const x = a.giaTri ? a.giaTri[cot] : null;
    const y = b.giaTri ? b.giaTri[cot] : null;
    if (laTrong(x) && laTrong(y)) return theoMa(a, b);
    if (laTrong(x)) return 1;
    if (laTrong(y)) return -1;
    if (x === y) return theoMa(a, b);
    return dau * (x - y);
  });
}

/** Loc danh sach dong theo tu khoa ma va theo nhom (`` | `vn30` | `ngoai-vn30`). */
export function locDong(dong, tuKhoa = '', nhom = '') {
  const tu = String(tuKhoa || '').trim().toLowerCase();
  return dong.filter((d) => {
    if (tu && !String(d.symbol).toLowerCase().includes(tu)) return false;
    if (nhom === 'vn30' && !d.vn30) return false;
    if (nhom === 'ngoai-vn30' && d.vn30) return false;
    return true;
  });
}

/** Doc cac dong cua bang ma tu DOM thanh dang thuan de sap xep va loc. */
export function docDongTuBang(tbody) {
  return Array.from(tbody.querySelectorAll('tr')).map((tr) => {
    const giaTri = {};
    const chu = {};
    tr.querySelectorAll('td').forEach((td) => {
      const cot = td.dataset.cot;
      if (!cot) return;
      chu[cot] = td.textContent;
      const tho = td.dataset.giaTri;
      giaTri[cot] = tho === undefined || tho === '' ? null : Number(tho);
    });
    return {
      symbol: tr.dataset.symbol,
      vn30: tr.dataset.vn30 === 'true',
      thieuLichSu: tr.dataset.thieuLichSu === 'true',
      giaTri,
      chu,
      el: tr,
    };
  });
}

// ---------------------------------------------------------------------------
// Lam moi du lieu: tep tu dong + gia realtime tu VPS
// ---------------------------------------------------------------------------

/** So ma toi da moi lan goi VPS, de URL khong qua dai. */
export const LO_VPS = 50;

/** Loi khi goi endpoint gia realtime cua VPS. */
export class LoiVps extends Error {
  constructor(thongDiep) {
    super(thongDiep);
    this.name = 'LoiVps';
  }
}

/** Gan tham so chong cache vao URL (FR5.2). */
export function ganUrlChongCache(url, moc = Date.now()) {
  const noi = String(url).includes('?') ? '&' : '?';
  return `${url}${noi}t=${moc}`;
}

/**
 * Tai lai tep du lieu cua lan chay tu dong, bo qua cache trinh duyet (FR5.2).
 *
 * Bao loi khi phan hoi khong hop le; nguoi goi (`lamMoi`) chiu trach nhiem
 * bien loi thanh thong bao chu khong lam trang trang.
 */
export async function taiDuLieuMoiNhat(fetchFn, url, moc = Date.now()) {
  const phanHoi = await fetchFn(ganUrlChongCache(url, moc), { cache: 'no-store' });
  if (!phanHoi || !phanHoi.ok) {
    throw new Error(`HTTP ${phanHoi ? phanHoi.status : 'không phản hồi'}`);
  }
  return phanHoi.json();
}

/** Doc mot dong phan hoi VPS thanh `{ma, gia, phanTramThayDoi}`, hoac `null`. */
function docDongVps(dong) {
  if (!dong || typeof dong !== 'object') return null;
  const ma = dong.sym || dong.symbol;
  if (!ma) return null;
  const gia = Number(dong.lastPrice);
  const phanTram = Number(dong.changePc);
  return {
    ma: String(ma).toUpperCase(),
    gia: Number.isFinite(gia) && gia > 0 ? gia : null,
    phanTramThayDoi: Number.isFinite(phanTram) ? phanTram : null,
  };
}

/**
 * Lay gia hien tai va phan tram thay doi tu VPS (FR5.3).
 *
 * Endpoint tra `Access-Control-Allow-Origin: *` nen trinh duyet goi truc tiep
 * duoc (rang buoc C11). Danh sach ma duoc chia lo de URL khong qua dai.
 *
 * Tra ve `Map` ma -> `{gia, phanTramThayDoi}`. Ma nao VPS khong tra thi khong
 * co trong Map — khong bao gio bia gia tri.
 */
export async function layGiaVps(fetchFn, endpoint, maList, kichThuocLo = LO_VPS) {
  const ket_qua = new Map();
  const ma = Array.from(maList || []);

  for (let i = 0; i < ma.length; i += kichThuocLo) {
    const lo = ma.slice(i, i + kichThuocLo);
    const url = `${endpoint}/${lo.join(',')}`;
    let phanHoi;
    try {
      // eslint-disable-next-line no-await-in-loop -- goi tuan tu de khong don endpoint
      phanHoi = await fetchFn(url);
    } catch (loi) {
      throw new LoiVps(`không gọi được VPS: ${loi.message}`);
    }
    if (!phanHoi || !phanHoi.ok) {
      throw new LoiVps(`VPS trả HTTP ${phanHoi ? phanHoi.status : 'không phản hồi'}`);
    }
    // eslint-disable-next-line no-await-in-loop
    const than = await phanHoi.json();
    for (const dong of Array.isArray(than) ? than : []) {
      const doc = docDongVps(dong);
      if (doc) ket_qua.set(doc.ma, { gia: doc.gia, phanTramThayDoi: doc.phanTramThayDoi });
    }
  }

  return ket_qua;
}

/**
 * Lam moi toan bo: tep du lieu tu dong + gia realtime.
 *
 * Ham nay **khong bao gio nem loi**: mot nguon loi chi thanh mot dong trong
 * `canhBao`, trang van chay voi du lieu con lai (FR5.5, NFR5).
 *
 * Chi so ky thuat KHONG duoc tinh lai tu gia VPS. `mocChiSo` giu nguyen moc
 * cua lan chay tu dong, `mocGia` la moc rieng cua gia realtime (FR5.4).
 */
export async function lamMoi({
  fetchFn,
  dataUrl,
  vpsEndpoint,
  maList,
  moc = Date.now(),
  kichThuocLo = LO_VPS,
}) {
  const ket_qua = {
    duLieu: null,
    mocChiSo: null,
    gia: new Map(),
    mocGia: null,
    canhBao: [],
  };

  try {
    ket_qua.duLieu = await taiDuLieuMoiNhat(fetchFn, dataUrl, moc);
    ket_qua.mocChiSo = ket_qua.duLieu ? ket_qua.duLieu.generated_at || null : null;
  } catch (loi) {
    ket_qua.canhBao.push(`Không tải được dữ liệu của lần chạy tự động: ${loi.message}`);
  }

  const ma =
    maList && maList.length
      ? maList
      : (ket_qua.duLieu && ket_qua.duLieu.stocks
          ? ket_qua.duLieu.stocks.map((s) => s.symbol)
          : []);

  try {
    ket_qua.gia = await layGiaVps(fetchFn, vpsEndpoint, ma, kichThuocLo);
    ket_qua.mocGia = new Date(moc).toISOString();
  } catch (loi) {
    ket_qua.gia = new Map();
    ket_qua.mocGia = null;
    ket_qua.canhBao.push(`Không lấy được giá realtime từ VPS: ${loi.message}`);
  }

  return ket_qua;
}

/** Doc mot the script JSON trong trang. */
function docJson(id) {
  const el = document.getElementById(id);
  if (!el) return null;
  try {
    return JSON.parse(el.textContent);
  } catch {
    return null;
  }
}

/** Trang thai giao dien sau khi mo khoa. */
const trangThai = {
  dong: [],
  cot: 'rs_63',
  huong: 'desc',
  tuKhoa: '',
  nhom: '',
  cauHinh: null,
};

/** Ve lai than bang theo trang thai loc va sap xep hien tai. */
function veLaiBang() {
  const tbody = document.getElementById('than-bang-ma');
  if (!tbody) return;

  const hien = sapXepDong(
    locDong(trangThai.dong, trangThai.tuKhoa, trangThai.nhom),
    trangThai.cot,
    trangThai.huong,
  );

  trangThai.dong.forEach((d) => {
    d.el.hidden = true;
  });
  hien.forEach((d) => {
    d.el.hidden = false;
    tbody.appendChild(d.el);
  });

  const dem = document.getElementById('so-dong');
  if (dem) dem.textContent = `${hien.length} mã`;

  document.querySelectorAll('#bang-ma th.sap-xep-duoc').forEach((th) => {
    const dung = th.dataset.cot === trangThai.cot;
    th.setAttribute(
      'aria-sort',
      dung ? (trangThai.huong === 'asc' ? 'ascending' : 'descending') : 'none',
    );
  });
}

/** Gan cac dieu khien bang: sap xep theo tieu de cot, loc theo tu khoa va nhom. */
function ganDieuKhienBang() {
  const tbody = document.getElementById('than-bang-ma');
  if (!tbody) return;
  trangThai.dong = docDongTuBang(tbody);

  document.querySelectorAll('#bang-ma th.sap-xep-duoc').forEach((th) => {
    const doiCot = () => {
      const cot = th.dataset.cot;
      if (trangThai.cot === cot) {
        trangThai.huong = trangThai.huong === 'asc' ? 'desc' : 'asc';
      } else {
        trangThai.cot = cot;
        trangThai.huong = th.dataset.kieu === 'so' ? 'desc' : 'asc';
      }
      veLaiBang();
    };
    th.addEventListener('click', doiCot);
    th.addEventListener('keydown', (bienCo) => {
      if (bienCo.key === 'Enter' || bienCo.key === ' ') {
        bienCo.preventDefault();
        doiCot();
      }
    });
  });

  const oLoc = document.getElementById('o-loc');
  if (oLoc) {
    oLoc.addEventListener('input', () => {
      trangThai.tuKhoa = oLoc.value;
      veLaiBang();
    });
  }

  const locNhom = document.getElementById('loc-nhom');
  if (locNhom) {
    locNhom.addEventListener('change', () => {
      trangThai.nhom = locNhom.value;
      veLaiBang();
    });
  }

  veLaiBang();
}

/** Dinh dang so theo quy uoc Viet Nam, khop voi ban dung o `render.py`. */
const DINH_DANG_SO = new Intl.NumberFormat('vi-VN', {
  minimumFractionDigits: 2,
  maximumFractionDigits: 2,
});

/** Dat lai noi dung mot o cua bang, giu ca gia tri tho de con sap xep duoc. */
function datO(tr, cot, giaTriTho, chuHien, lop = '') {
  const td = tr.querySelector(`td[data-cot="${cot}"]`);
  if (!td) return;
  td.dataset.giaTri = giaTriTho === null || giaTriTho === undefined ? '' : String(giaTriTho);
  td.textContent = chuHien;
  td.classList.remove('tang', 'giam');
  if (lop) td.classList.add(lop);
}

/** Ap dung du lieu cua lan chay tu dong vua tai lai (FR5.2). */
function apDungDuLieuTuDong(duLieu) {
  const moc = document.querySelector('[data-testid="moc-chi-so"]');
  if (moc && duLieu.generated_at) {
    moc.textContent = duLieu.generated_at;
    moc.setAttribute('datetime', duLieu.generated_at);
  }

  const nhan = document.querySelector('[data-testid="nhan-phien"]');
  const ten = {
    intraday: 'Đang trong phiên',
    closed: 'Đã chốt phiên',
    no_new_data: 'Không có dữ liệu mới',
  };
  if (nhan && duLieu.session_status) {
    nhan.dataset.trangThai = duLieu.session_status;
    nhan.textContent = ten[duLieu.session_status] || duLieu.session_status;
  }

  for (const s of duLieu.stocks || []) {
    const tr = document.querySelector(`tr[data-symbol="${s.symbol}"]`);
    if (!tr) continue;
    for (const cot of ['close', 'rs_63', 'dist_ma20_pct', 'vol_ratio', 'atr14_pct']) {
      if (s[cot] === null || s[cot] === undefined) continue;
      datO(tr, cot, s[cot], DINH_DANG_SO.format(s[cot]));
    }
  }
}

/** Ap dung gia realtime tu VPS; chi so ky thuat khong bi tinh lai (FR5.3, FR5.4). */
function apDungGiaVps(gia, mocGia) {
  for (const [ma, ban_ghi] of gia) {
    const tr = document.querySelector(`tr[data-symbol="${ma}"]`);
    if (!tr) continue;
    if (ban_ghi.gia !== null) {
      datO(tr, 'close', ban_ghi.gia, DINH_DANG_SO.format(ban_ghi.gia));
    }
    if (ban_ghi.phanTramThayDoi !== null) {
      const p = ban_ghi.phanTramThayDoi;
      const chu = `${p >= 0 ? '+' : ''}${DINH_DANG_SO.format(p)}%`;
      datO(tr, 'change_pct', p, chu, p > 0 ? 'tang' : p < 0 ? 'giam' : '');
    }
  }

  const o = document.querySelector('[data-testid="moc-gia"]');
  if (o) {
    o.textContent = mocGia
      ? new Date(mocGia).toLocaleTimeString('vi-VN')
      : 'không lấy được';
  }
}

/** Gan nut "Lấy dữ liệu mới nhất" (FR5.1). */
function ganNutLamMoi() {
  const nut = document.getElementById('nut-lam-moi');
  if (!nut) return;

  nut.addEventListener('click', async () => {
    const cauHinh = trangThai.cauHinh || {};
    const thongBao = document.getElementById('thong-bao-lam-moi');
    nut.disabled = true;
    if (thongBao) thongBao.textContent = 'Đang lấy dữ liệu mới…';

    try {
      const kq = await lamMoi({
        fetchFn: (url, tuyChon) => fetch(url, tuyChon),
        dataUrl: cauHinh.data_url || 'data/latest.json',
        vpsEndpoint: cauHinh.vps_endpoint || '',
        maList: trangThai.dong.map((d) => d.symbol),
      });

      if (kq.duLieu) apDungDuLieuTuDong(kq.duLieu);
      apDungGiaVps(kq.gia, kq.mocGia);

      const tbody = document.getElementById('than-bang-ma');
      if (tbody) trangThai.dong = docDongTuBang(tbody);
      veLaiBang();

      if (thongBao) {
        thongBao.textContent = kq.canhBao.length
          ? kq.canhBao.join(' · ')
          : 'Đã cập nhật.';
      }
    } catch (loi) {
      // Lop bao ve cuoi: du co gi bat thuong thi trang cung khong trang (NFR5).
      if (thongBao) thongBao.textContent = `Không làm mới được: ${loi.message}`;
    } finally {
      nut.disabled = false;
    }
  });
}

/** Xu ly submit form mat khau: giai ma va dung giao dien. */
async function moKhoa(bienCo) {
  bienCo.preventDefault();
  const oMatKhau = document.getElementById('o-mat-khau');
  const nut = document.getElementById('nut-mo');
  const thongBao = document.getElementById('thong-bao-mo-khoa');

  thongBao.textContent = 'Đang giải mã, vui lòng đợi…';
  nut.disabled = true;

  try {
    const noiDung = await giaiMaKhoi(docJson(KHOI_MA_ID), oMatKhau.value);
    const khung = document.getElementById('noi-dung');
    khung.innerHTML = noiDung;
    khung.hidden = false;
    document.getElementById('man-mo-khoa').hidden = true;
    oMatKhau.value = '';
    thongBao.textContent = '';
    ganDieuKhienBang();
    ganNutLamMoi();
    // Muc danh sach ca nhan chi ton tai sau khi noi dung duoc giai ma va chen
    // vao DOM, nen phai gan su kien o day chu khong o khoiDong().
    //
    // Nap `latest.json` mot lan de bang ca nhan co du chi so va ba gia tri suy
    // ra. Bang chinh duoc dung san o phia workflow nen khong can, nhung bang ca
    // nhan ve bang JavaScript tu danh sach trong may nguoi dung.
    await napDuLieuTinhSan();
    khoiTaoCaNhan();
  } catch (loi) {
    thongBao.textContent =
      loi instanceof LoiGiaiMa ? loi.message : 'Không mở được nội dung.';
  } finally {
    nut.disabled = false;
  }
}


/** Nap `latest.json` vao bien toan cuc cho bang ca nhan dung.
 *
 *  Loi khong duoc lam trang trang: bang ca nhan se hien cac o dau gach thay vi
 *  bien mat, va nguoi dung van doc duoc phan noi dung phuong phap.
 */
export async function napDuLieuTinhSan(fetchFn = globalThis.fetch) {
  try {
    const url = trangThai.cauHinh?.dataUrl || 'data/latest.json';
    const r = await fetchFn(ganUrlChongCache(url));
    if (!r?.ok) return null;
    const d = await r.json();
    globalThis.__DU_LIEU__ = d;
    return d;
  } catch {
    return null;
  }
}

/** Diem vao phia trinh duyet. */
export function khoiDong() {
  trangThai.cauHinh = docJson(CAU_HINH_ID);
  const form = document.getElementById('form-mo-khoa');
  if (form) form.addEventListener('submit', moKhoa);
}

if (typeof document !== 'undefined' && document.getElementById('form-mo-khoa')) {
  khoiDong();
}

// ---------------------------------------------------------------------------
// Danh sach theo doi ca nhan
//
// Luu trong localStorage cua nguoi dung, KHONG trong repo: repo xuat ban la
// public nen danh sach ma ho theo doi khong duoc nam trong HTML.
//
// Ma nao co trong du lieu tinh san thi hien du chi so. Ma ngoai danh sach chi
// hien gia lay qua VPS va cac cot chi so de trong — RS 63 phien, MA stack, ATR
// deu can hon 300 phien lich su, ma trinh duyet khong lay duoc vi DNSE khong
// cho goi truc tiep (khong co CORS).
// ---------------------------------------------------------------------------

export const KHOA_LUU_TRU = 'theo-doi-ca-nhan-v1';

/** Chuan hoa ma: in hoa, bo khoang trang. Tra rong khi khong hop le. */
export function chuanHoaMa(tho) {
  const ma = String(tho ?? '').trim().toUpperCase();
  return /^[A-Z0-9]{3,10}$/.test(ma) ? ma : '';
}

/** Doc danh sach. Du lieu hong tra ve rong thay vi nem loi — mot ban ghi hong
 *  khong duoc lam trang ca trang. */
export function docDanhSach(kho = globalThis.localStorage) {
  try {
    const tho = kho?.getItem(KHOA_LUU_TRU);
    if (!tho) return [];
    const ds = JSON.parse(tho);
    return Array.isArray(ds) ? ds.filter((x) => chuanHoaMa(x)) : [];
  } catch {
    return [];
  }
}

function ghiDanhSach(ds, kho = globalThis.localStorage) {
  kho?.setItem(KHOA_LUU_TRU, JSON.stringify(ds));
  return ds;
}

/** Them mot ma. Ma trung bi gop, khong nhan doi. */
export function themMa(tho, kho = globalThis.localStorage) {
  const ma = chuanHoaMa(tho);
  const ds = docDanhSach(kho);
  if (!ma || ds.includes(ma)) return ds;
  return ghiDanhSach([...ds, ma], kho);
}

/** Bo mot ma khoi danh sach. */
export function boMa(tho, kho = globalThis.localStorage) {
  const ma = chuanHoaMa(tho);
  return ghiDanhSach(docDanhSach(kho).filter((x) => x !== ma), kho);
}

/** Ghep danh sach ca nhan voi du lieu tinh san va gia realtime tu VPS.
 *
 *  Giu dung thu tu nguoi dung da them. Ma khong co trong du lieu tinh san duoc
 *  danh dau `co_chi_so: false` va moi chi so de `null` — de trong con trung thuc
 *  hon la dien so tinh tren cua so du lieu chua day.
 */
export function ghepDuLieuCaNhan(danhSach, tinhSan = [], giaVps = {}) {
  const theoMa = new Map((tinhSan || []).map((s) => [s.symbol, s]));
  const CHI_SO_TRONG = {
    rs_63: null,
    ma_stack: null,
    dist_ma20_pct: null,
    vol_ratio: null,
    pct_from_52w_high: null,
    atr14_pct: null,
    liquidity_20d: null,
    boi_canh: null,
    trigger: null,
    stoploss: null,
  };

  return (danhSach || []).map((ma) => {
    const co = theoMa.get(ma);
    if (co) return { ...co, co_chi_so: true };
    const gia = giaVps?.[ma] || {};
    return {
      symbol: ma,
      co_chi_so: false,
      close: gia.close ?? null,
      change_pct: gia.change_pct ?? null,
      ...CHI_SO_TRONG,
    };
  });
}

/** Danh sach dang van ban de dan vao `watchlist.txt` trong repo nguon. */
export function danhSachDeDan(danhSach) {
  return (danhSach || []).join('\n');
}

// ---------------------------------------------------------------------------
// Ve bang danh sach ca nhan
//
// Tach ham ve ra khoi phan gan su kien DOM: ham nhan du lieu va tra chuoi HTML
// nen test duoc trong Node ma khong can dung document.
// ---------------------------------------------------------------------------

/** Escape ky tu HTML. Ma do nguoi dung nhap nen phai escape truoc khi nhung. */
export function escapeHtml(tho) {
  return String(tho ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

/** Dinh dang so theo kieu Viet Nam; tra dau gach khi khong co gia tri. */
export function soVn(gia_tri, thapPhan = 2) {
  if (gia_tri === null || gia_tri === undefined || Number.isNaN(gia_tri)) return '—';
  return Number(gia_tri).toLocaleString('vi-VN', {
    minimumFractionDigits: thapPhan,
    maximumFractionDigits: thapPhan,
  });
}

const NHAN_SETUP = {
  pullback_ma20: 'Pullback MA20',
  break_kem_volume: 'Break kèm volume',
  qua_mo_rong: 'Quá mở rộng — không mua',
  khong_nhan_dien: 'Không nhận diện',
};

/** Ve mot dong cua bang ca nhan.
 *
 *  Ma chua co chi so duoc danh dau `data-chua-co-chi-so="true"` va cac o de dau
 *  gach — khong bao gio in chu `null` ra giao dien, va khong bia so.
 */
export function veDongCaNhan(hang) {
  const ma = escapeHtml(hang.symbol);
  const coChiSo = hang.co_chi_so === true;
  const tr = hang.trigger || {};
  const sl = hang.stoploss || {};

  const o = [
    `<td data-cot="symbol">${ma}</td>`,
    `<td data-cot="close">${soVn(hang.close)}</td>`,
    `<td data-cot="change_pct">${soVn(hang.change_pct)}</td>`,
    `<td data-cot="rs_63">${soVn(hang.rs_63)}</td>`,
    `<td data-cot="ma_stack">${hang.ma_stack === null || hang.ma_stack === undefined ? '—' : hang.ma_stack ? 'Có' : 'Không'}</td>`,
    `<td data-cot="dist_ma20_pct">${soVn(hang.dist_ma20_pct)}</td>`,
    `<td data-cot="vol_ratio">${soVn(hang.vol_ratio)}</td>`,
    `<td data-cot="pct_from_52w_high">${soVn(hang.pct_from_52w_high)}</td>`,
    `<td data-cot="atr14_pct">${soVn(hang.atr14_pct)}</td>`,
    `<td data-cot="liquidity_20d">${hang.liquidity_20d ? soVn(hang.liquidity_20d / 1e9, 1) : '—'}</td>`,
    `<td data-cot="boi_canh">${escapeHtml(hang.boi_canh || '—')}</td>`,
    `<td data-cot="trigger" title="${escapeHtml(tr.dien_giai || '')}">${escapeHtml(NHAN_SETUP[tr.setup] || '—')}</td>`,
    `<td data-cot="stoploss" title="${escapeHtml(sl.dien_giai || '')}">${soVn(sl.gia)}</td>`,
    `<td><button type="button" data-bo-ma="${ma}" aria-label="Bỏ ${ma} khỏi danh sách">Bỏ</button></td>`,
  ].join('');

  return `<tr data-symbol="${ma}" data-chua-co-chi-so="${coChiSo ? 'false' : 'true'}">${o}</tr>`;
}

/** Ve toan bo than bang. Bang rong hien dong huong dan thay vi trong tron. */
export function veBangCaNhan(cacHang) {
  if (!cacHang || cacHang.length === 0) {
    return (
      '<tr class="dong-trong"><td colspan="14">Chưa có mã nào. ' +
      'Nhập mã vào ô phía trên rồi bấm Thêm.</td></tr>'
    );
  }
  return cacHang.map(veDongCaNhan).join('');
}

/** Gan su kien cho muc danh sach ca nhan. Goi khi trang da mo khoa. */
export function khoiTaoCaNhan(doc = globalThis.document, kho = globalThis.localStorage) {
  const than = doc?.getElementById('than-bang-ca-nhan');
  if (!than) return null;

  const oThem = doc.getElementById('o-them-ma');
  const nutThem = doc.getElementById('nut-them-ma');
  const nutSaoChep = doc.getElementById('nut-sao-chep-danh-sach');
  const thongBao = doc.getElementById('thong-bao-ca-nhan');

  const noi = (van) => {
    if (thongBao) thongBao.textContent = van;
  };

  // Trang thai sap xep/loc rieng cua bang ca nhan. Giu o day thay vi trong DOM:
  // moi lan them hoac bo ma la ve lai ca bang, neu doc thu tu tu DOM thi mat.
  const tt = { cot: 'symbol', huong: 'asc', tuKhoa: '' };

  function veLai() {
    const ds = docDanhSach(kho);
    const tinhSan = globalThis.__DU_LIEU__?.stocks || [];
    const giaVps = globalThis.__GIA_VPS__ || {};
    let hang = ghepDuLieuCaNhan(ds, tinhSan, giaVps);
    hang = locCaNhan(hang, tt.tuKhoa);
    hang = sapXepCaNhan(hang, tt.cot, tt.huong);
    than.innerHTML = veBangCaNhan(hang);
    capNhatAriaSort();
  }

  function capNhatAriaSort() {
    doc.querySelectorAll('#bang-ca-nhan th.sap-xep-duoc').forEach((th) => {
      const cot = th.dataset.cot;
      th.setAttribute(
        'aria-sort',
        cot === tt.cot ? (tt.huong === 'asc' ? 'ascending' : 'descending') : 'none',
      );
    });
  }

  // Sap xep khi bam hoac go Enter/Space tren tieu de cot (NFR6: dung ban phim).
  doc.querySelectorAll('#bang-ca-nhan th.sap-xep-duoc').forEach((th) => {
    const doiCot = () => {
      const cot = th.dataset.cot;
      if (!cot) return;
      if (tt.cot === cot) {
        tt.huong = tt.huong === 'asc' ? 'desc' : 'asc';
      } else {
        tt.cot = cot;
        tt.huong = 'asc';
      }
      veLai();
    };
    th.addEventListener('click', doiCot);
    th.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        doiCot();
      }
    });
  });

  const oLocCaNhan = doc.getElementById('o-loc-ca-nhan');
  oLocCaNhan?.addEventListener('input', () => {
    tt.tuKhoa = oLocCaNhan.value;
    veLai();
  });

  nutThem?.addEventListener('click', () => {
    const ma = chuanHoaMa(oThem?.value);
    if (!ma) {
      noi('Mã không hợp lệ. Dùng 3–10 chữ và số, ví dụ FPT.');
      return;
    }
    const truoc = docDanhSach(kho).length;
    const sau = themMa(ma, kho).length;
    noi(sau > truoc ? `Đã thêm ${ma}.` : `${ma} đã có trong danh sách.`);
    if (oThem) oThem.value = '';
    veLai();
  });

  oThem?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') nutThem?.click();
  });

  than.addEventListener('click', (e) => {
    const ma = e.target?.getAttribute?.('data-bo-ma');
    if (!ma) return;
    boMa(ma, kho);
    noi(`Đã bỏ ${ma}.`);
    veLai();
  });

  nutSaoChep?.addEventListener('click', async () => {
    const van = danhSachDeDan(docDanhSach(kho));
    try {
      await globalThis.navigator?.clipboard?.writeText(van);
      noi('Đã sao chép. Dán vào watchlist.txt trong repo nguồn để lần chạy sau tính đủ chỉ số.');
    } catch {
      noi(`Không sao chép được. Danh sách: ${van.replaceAll('\n', ', ')}`);
    }
  });

  veLai();
  return { veLai };
}

// ---------------------------------------------------------------------------
// Sap xep va loc bang ca nhan
//
// Bang chinh duoc dung san o phia workflow nen sap xep bang cach doc lai DOM.
// Bang ca nhan thi khac: du lieu do JavaScript quan tu localStorage, nen phai
// sap xep tren DU LIEU roi ve lai. Sap xep DOM se mat thu tu ngay lan ve lai
// tiep theo (them ma, bo ma, hoac bam nut lam moi).
// ---------------------------------------------------------------------------

function _trong(v) {
  return v === null || v === undefined || v === '' || Number.isNaN(v);
}

/** Sap xep du lieu bang ca nhan. Khong lam thay doi mang goc.
 *
 *  O trong luon xuong cuoi bat ke huong: mot ma chua co chi so khong nen chiem
 *  dau bang chi vi gia tri cua no la rong.
 */
export function sapXepCaNhan(cacHang, cot, huong = 'asc') {
  const dau = huong === 'desc' ? -1 : 1;
  return [...(cacHang || [])].sort((a, b) => {
    const x = a?.[cot];
    const y = b?.[cot];
    if (_trong(x) && _trong(y)) return 0;
    if (_trong(x)) return 1;
    if (_trong(y)) return -1;
    if (typeof x === 'number' && typeof y === 'number') return (x - y) * dau;
    return String(x).localeCompare(String(y), 'vi') * dau;
  });
}

/** Loc theo ma, khong phan biet chu hoa. Tu khoa rong tra ve tat ca. */
export function locCaNhan(cacHang, tuKhoa = '') {
  const k = String(tuKhoa ?? '').trim().toUpperCase();
  if (!k) return [...(cacHang || [])];
  return (cacHang || []).filter((r) => String(r?.symbol ?? '').toUpperCase().includes(k));
}
